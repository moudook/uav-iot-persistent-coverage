[General]
abstract = true
sim-time-limit = 10s
ned-package-exclusions = inet-4.6.0;simu5g-1.4.3;omnetpp-6.4.0
ned-path = sim;inet-4.6.0/src;simu5g-1.4.3/src
load-libs = inet-4.6.0/src/libINET.so simu5g-1.4.3/src/libsimu5g.so
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
**.vector-recording = false
**.scalar-recording = true

**.mobility.constraintAreaMaxX = 100000m
**.mobility.constraintAreaMaxY = 100000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 200m
**.mobility.initFromDisplayString = false
**.mobility.updateFromDisplayString = false

# ---------------------------------------------------------------------------
# Shared application configuration: the UAV base station emits 1000-byte
# multicast UDP packets every 20 ms; each ground sensor counts what it
# receives.  The received count is the link-closure observable.
# ---------------------------------------------------------------------------
# uav-app   := *.uav.numApps = 1
#              *.uav.app[0].typename = "UdpApp"
#              *.uav.app[0].source.typename = "ActivePacketSource"
#              *.uav.app[0].source.packetLength = 1000B
#              *.uav.app[0].source.productionInterval = 0.02s
#              *.uav.app[0].source.maxPackets = 200
#              *.uav.app[0].io.destAddress = "224.0.0.1"
#              *.uav.app[0].io.destPort = 5000
#              *.uav.app[0].io.localPort = 5000
# sensor-app := *.sensor.numApps = 1
#              *.sensor.app[0].typename = "UdpSink"
#              *.sensor.app[0].localPort = 5000
#              *.sensor.app[0].receiveBroadcast = true
#              *.sensor.app[0].multicastGroup = "224.0.0.1"

# ---------------------------------------------------------------------------
# PhyValidation: the report's operating range (R_cov = 35 m, R_comm = 40 m).
# UAV at z0 = 50 m, ground sensors at horizontal range 10..80 m.
# ---------------------------------------------------------------------------
[Config PhyValidation]
network = sim.PhyValidation
sim-time-limit = 10s
*.numSensors = 8
*.uav.mobility.initialX = 0m
*.uav.mobility.initialY = 0m
*.uav.mobility.initialZ = 50m
*.sensor[0].mobility.initialX = 10m
*.sensor[1].mobility.initialX = 20m
*.sensor[2].mobility.initialX = 30m
*.sensor[3].mobility.initialX = 35m
*.sensor[4].mobility.initialX = 40m
*.sensor[5].mobility.initialX = 50m
*.sensor[6].mobility.initialX = 60m
*.sensor[7].mobility.initialX = 80m
*.uav.numApps = 1
*.uav.app[0].typename = "UdpApp"
*.uav.app[0].source.typename = "ActivePacketSource"
*.uav.app[0].source.packetLength = 1000B
*.uav.app[0].source.productionInterval = 0.02s
*.uav.app[0].source.maxPackets = 200
*.uav.app[0].io.destAddress = "224.0.0.1"
*.uav.app[0].io.destPort = 5000
*.uav.app[0].io.localPort = 5000
*.sensor.numApps = 1
*.sensor.app[0].typename = "UdpSink"
*.sensor.app[0].localPort = 5000
*.sensor.app[0].receiveBroadcast = true
*.sensor.app[0].multicastGroup = "224.0.0.1"

# ---------------------------------------------------------------------------
# PhyValidationControl: transmit power crushed by 60 dB.  If the received
# count does not change, the scenario is not measuring the physical layer and
# the validation would be meaningless.  This config is the control.
# ---------------------------------------------------------------------------
[Config PhyValidationControl]
network = sim.PhyValidation
sim-time-limit = 10s
*.numSensors = 3
*.uav.wlan[0].radio.transmitter.power = 1e-6W
*.uav.mobility.initialX = 0m
*.uav.mobility.initialY = 0m
*.uav.mobility.initialZ = 50m
*.sensor[0].mobility.initialX = 10m
*.sensor[1].mobility.initialX = 1000m
*.sensor[2].mobility.initialX = 50000m
*.uav.numApps = 1
*.uav.app[0].typename = "UdpApp"
*.uav.app[0].source.typename = "ActivePacketSource"
*.uav.app[0].source.packetLength = 1000B
*.uav.app[0].source.productionInterval = 0.02s
*.uav.app[0].source.maxPackets = 200
*.uav.app[0].io.destAddress = "224.0.0.1"
*.uav.app[0].io.destPort = 5000
*.uav.app[0].io.localPort = 5000
*.sensor.numApps = 1
*.sensor.app[0].typename = "UdpSink"
*.sensor.app[0].localPort = 5000
*.sensor.app[0].receiveBroadcast = true
*.sensor.app[0].multicastGroup = "224.0.0.1"

# ---------------------------------------------------------------------------
# PhyValidationFar: the same geometry extended until the link actually
# breaks, so that Python and INET are compared at the CLOSURE BOUNDARY and
# not only in the trivially-passing regime.
# ---------------------------------------------------------------------------
[Config PhyValidationFar]
network = sim.PhyValidation
sim-time-limit = 10s
*.numSensors = 9
*.uav.mobility.initialX = 0m
*.uav.mobility.initialY = 0m
*.uav.mobility.initialZ = 50m
*.sensor[0].mobility.initialX = 100m
*.sensor[1].mobility.initialX = 1000m
*.sensor[2].mobility.initialX = 3000m
*.sensor[3].mobility.initialX = 5000m
*.sensor[4].mobility.initialX = 7000m
*.sensor[5].mobility.initialX = 8000m
*.sensor[6].mobility.initialX = 8800m
*.sensor[7].mobility.initialX = 8900m
*.sensor[8].mobility.initialX = 9500m
*.uav.numApps = 1
*.uav.app[0].typename = "UdpApp"
*.uav.app[0].source.typename = "ActivePacketSource"
*.uav.app[0].source.packetLength = 1000B
*.uav.app[0].source.productionInterval = 0.02s
*.uav.app[0].source.maxPackets = 200
*.uav.app[0].io.destAddress = "224.0.0.1"
*.uav.app[0].io.destPort = 5000
*.uav.app[0].io.localPort = 5000
*.sensor.numApps = 1
*.sensor.app[0].typename = "UdpSink"
*.sensor.app[0].localPort = 5000
*.sensor.app[0].receiveBroadcast = true
*.sensor.app[0].multicastGroup = "224.0.0.1"

# ---------------------------------------------------------------------------
# PhyValidationFar2: locate INET's exact closure boundary, to characterise
# the sub-dB disagreement seen at 8.9 km in the first far sweep.
# ---------------------------------------------------------------------------
[Config PhyValidationFar2]
network = sim.PhyValidation
sim-time-limit = 10s
*.numSensors = 9
*.uav.mobility.initialX = 0m
*.uav.mobility.initialY = 0m
*.uav.mobility.initialZ = 50m
*.sensor[0].mobility.initialX = 8860m
*.sensor[1].mobility.initialX = 9000m
*.sensor[2].mobility.initialX = 9500m
*.sensor[3].mobility.initialX = 10000m
*.sensor[4].mobility.initialX = 11000m
*.sensor[5].mobility.initialX = 12000m
*.sensor[6].mobility.initialX = 15000m
*.sensor[7].mobility.initialX = 20000m
*.sensor[8].mobility.initialX = 50000m
*.uav.numApps = 1
*.uav.app[0].typename = "UdpApp"
*.uav.app[0].source.typename = "ActivePacketSource"
*.uav.app[0].source.packetLength = 1000B
*.uav.app[0].source.productionInterval = 0.02s
*.uav.app[0].source.maxPackets = 200
*.uav.app[0].io.destAddress = "224.0.0.1"
*.uav.app[0].io.destPort = 5000
*.uav.app[0].io.localPort = 5000
*.sensor.numApps = 1
*.sensor.app[0].typename = "UdpSink"
*.sensor.app[0].localPort = 5000
*.sensor.app[0].receiveBroadcast = true
*.sensor.app[0].multicastGroup = "224.0.0.1"

# ---------------------------------------------------------------------------
# PhyValidationNLoS: path-loss exponent 3.5 (the report's obstructed case).
# The closure boundary then falls at ~180 m, i.e. inside the report's
# 80x80 m operating world rather than at 9 km, so this is the discriminating
# comparison between the two implementations.
# ---------------------------------------------------------------------------
[Config PhyValidationNLoS]
network = sim.PhyValidation
sim-time-limit = 10s
*.numSensors = 9
*.radioMedium.pathLoss.alpha1 = 3.5
*.radioMedium.pathLoss.alpha2 = 3.5
*.uav.mobility.initialX = 0m
*.uav.mobility.initialY = 0m
*.uav.mobility.initialZ = 50m
*.sensor[0].mobility.initialX = 40m
*.sensor[1].mobility.initialX = 60m
*.sensor[2].mobility.initialX = 100m
*.sensor[3].mobility.initialX = 140m
*.sensor[4].mobility.initialX = 160m
*.sensor[5].mobility.initialX = 180m
*.sensor[6].mobility.initialX = 190m
*.sensor[7].mobility.initialX = 220m
*.sensor[8].mobility.initialX = 300m
*.uav.numApps = 1
*.uav.app[0].typename = "UdpApp"
*.uav.app[0].source.typename = "ActivePacketSource"
*.uav.app[0].source.packetLength = 1000B
*.uav.app[0].source.productionInterval = 0.02s
*.uav.app[0].source.maxPackets = 200
*.uav.app[0].io.destAddress = "224.0.0.1"
*.uav.app[0].io.destPort = 5000
*.uav.app[0].io.localPort = 5000
*.sensor.numApps = 1
*.sensor.app[0].typename = "UdpSink"
*.sensor.app[0].localPort = 5000
*.sensor.app[0].receiveBroadcast = true
*.sensor.app[0].multicastGroup = "224.0.0.1"

[General]
abstract = true
sim-time-limit = 30s
ned-package-exclusions = inet-4.6.0;simu5g-1.4.3;omnetpp-6.4.0
ned-path = sim;inet-4.6.0/src;simu5g-1.4.3/src
load-libs = inet-4.6.0/src/libINET.so simu5g-1.4.3/src/libsimu5g.so
**.routingRecorder.enabled = false
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
**.vector-recording = true
**.scalar-recording = true

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

**.numBands = 50
**.ueTxPower = 26dBm
**.gnbTxPower = 40dBm

*.configurator.config = xml("<config> \
    <interface among='gnb* *Upf*' address='10.x.x.x' netmask='255.255.255.0'/> \
    <interface hosts='*' address='192.168.x.x' netmask='255.255.255.0'/> \
</config>")

[Config UAVIoT]
network = sim.UAVIoTNetwork
sim-time-limit = 20s
*.gnb.mobility.initialX = 650m
*.gnb.mobility.initialY = 200m
*.numUe = 3
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1
*.ue[0].mobility.initialX = 550m
*.ue[0].mobility.initialY = 350m
*.ue[1].servingNodeId = 0
*.ue[1].nrServingNodeId = 1
*.ue[1].mobility.initialX = 650m
*.ue[1].mobility.initialY = 400m
*.ue[2].servingNodeId = 0
*.ue[2].nrServingNodeId = 1
*.ue[2].mobility.initialX = 750m
*.ue[2].mobility.initialY = 350m
*.numIoTNodes = 5
